<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片字幕生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 data-i18n="title">图片字幕生成器</h1>
    <section class="controls">
      <div class="row">
        <label class="label" data-i18n="chooseFile">选择文件</label>
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/jpg,image/webp">
        <span id="fileName" class="file-name"></span>
      </div>
      <div class="row grid">
        <div class="field">
          <label for="langSelect" data-i18n="lang">语言</label>
          <select id="langSelect">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="field">
          <label for="textFileInput" data-i18n="importText">导入文本文件</label>
          <input id="textFileInput" type="file" accept=".txt,.csv,.json,text/plain,application/json">
        </div>
      </div>
      <div class="row grid">
        <div class="field">
          <label for="lineHeight" data-i18n="lineHeightLabel">字幕高度(px)</label>
          <input id="lineHeight" type="number" min="10" value="40">
        </div>
        <div class="field">
          <label for="fontSize" data-i18n="fontSizeLabel">字体大小(px)</label>
          <input id="fontSize" type="number" min="10" value="20">
        </div>
        <div class="field">
          <label for="fillColor" data-i18n="fillColorLabel">字体颜色</label>
          <input id="fillColor" type="color" value="#ffffff">
        </div>
        <div class="field">
          <label for="strokeColor" data-i18n="strokeColorLabel">轮廓颜色</label>
          <input id="strokeColor" type="color" value="#000000">
        </div>
      </div>
      <div class="row grid">
        <div class="field">
          <label for="fontFamily" data-i18n="fontFamilyLabel">字体</label>
          <select id="fontFamily">
            <option value="Microsoft YaHei">Microsoft YaHei</option>
            <option value="Noto Sans SC">Noto Sans SC</option>
            <option value="PingFang SC">PingFang SC</option>
            <option value="Arial">Arial</option>
            <option value="Helvetica">Helvetica</option>
          </select>
        </div>
        <div class="field">
          <label for="fontWeight" data-i18n="fontWeightLabel">字重</label>
          <select id="fontWeight">
            <option value="400">400</option>
            <option value="500">500</option>
            <option value="600">600</option>
            <option value="700" selected>700</option>
          </select>
        </div>
        <div class="field">
          <label for="letterSpacing" data-i18n="letterSpacingLabel">字间距(px)</label>
          <input id="letterSpacing" type="number" min="0" value="0">
        </div>
      </div>
      <div class="row grid">
        <div class="field">
          <label for="barColor" data-i18n="barColorLabel">背景颜色</label>
          <input id="barColor" type="color" value="#000000">
        </div>
        <div class="field">
          <label for="barAlpha" data-i18n="barAlphaLabel">背景透明度(0-1)</label>
          <input id="barAlpha" type="number" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="field">
          <label for="barRadius" data-i18n="barRadiusLabel">背景圆角(px)</label>
          <input id="barRadius" type="number" min="0" value="6">
        </div>
        <div class="field">
          <label for="gap" data-i18n="gapLabel">行间隙(px)</label>
          <input id="gap" type="number" min="0" value="8">
        </div>
        <div class="field">
          <label for="paddingX" data-i18n="paddingXLabel">左右内边距(px)</label>
          <input id="paddingX" type="number" min="0" value="24">
        </div>
        <div class="field">
          <label for="bottomMargin" data-i18n="bottomMarginLabel">底部边距(px)</label>
          <input id="bottomMargin" type="number" min="0" value="20">
        </div>
      </div>
      <div class="row">
        <textarea id="textInput" data-i18n-placeholder="textareaPlaceholder" placeholder="在此输入多行字幕，回车换行"></textarea>
      </div>
      <div class="row actions">
        <button id="generateBtn" class="btn primary" data-i18n="generateBtn">生成字幕图片</button>
        <button id="saveBtn" class="btn" data-i18n="saveBtn">保存图片</button>
      </div>
    </section>
    <section class="preview">
      <canvas id="canvas" class="canvas"></canvas>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
